# A request that mutates state and carries a browser Origin header is a cross-site request from a web page:
# the dashboard never writes to the coordinators from the browser, and local scripts send no Origin.
map "$request_method:$http_origin" $browser_mutation {
  default 0;
  "~^(POST|PUT|PATCH|DELETE):.+" 1;
}

# Unknown Host values (for example a DNS-rebinding hostname) never reach the application.
server {
  listen 80 default_server;
  server_name _;
  return 421;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ {
    set $control http://control:8080;
    proxy_pass $control$request_uri;
    proxy_set_header Host $http_host;
    proxy_read_timeout 15s;
  }
  location ~ ^/nodes/(coordinator[123])/(.*)$ {
    if ($browser_mutation) { return 403; }
    set $node http://$1:8080;
    proxy_pass $node/$2$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 65s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
